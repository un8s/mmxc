name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The same gate as `just check`, without needing just on the runner.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # PDF statement extraction shells out to Poppler's pdftotext, as the
      # release image does (Dockerfile); the PDF tests exercise the real binary.
      - name: install poppler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      # -race: requests run concurrently against state Settings can replace
      # (runtime.go); the race detector is what makes those tests meaningful.
      - name: go test
        run: go test -race ./...

      # CGO_ENABLED=0 is how the release image is built; keep it compiling that way.
      - name: build
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/mmxc
